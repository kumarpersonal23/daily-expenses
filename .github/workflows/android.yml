name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Dependencies and generated database
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Configure release signing
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Permanent signing is not configured. Run python3 tool/setup_signing.py once in your trusted GitHub Codespace. Debug APK distribution is disabled."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daily-expenses.jks"
          python3 - <<'PY'
          import os
          def escape(s):
              return s.replace('\\','\\\\').replace('\n','\\n').replace('\r','\\r')
          with open('android/key.properties','w') as f:
              for k,v in {'storeFile':os.environ['RUNNER_TEMP']+'/daily-expenses.jks','storePassword':os.environ['STORE_PASSWORD'],'keyPassword':os.environ['KEY_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS']}.items():
                  f.write(k+'='+escape(v)+'\n')
          PY
      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --release --split-per-abi
      - name: Publish signed release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Expenses-ARM64-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing credentials
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/daily-expenses.jks"
