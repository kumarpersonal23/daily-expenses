name: daily_expenses
description: Private offline daily expense ledger and bill organizer.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  drift: 2.30.0
  sqlite3: 2.9.4
  sqlite3_flutter_libs: 0.5.41
  path: 1.9.1
  path_provider: 2.1.5
  intl: 0.20.2
  image_picker: 1.2.1
  file_picker: 10.3.8
  flutter_secure_storage: 9.2.4
  cryptography: 2.7.0
  archive: 4.0.7
  share_plus: 12.0.1
  cross_file: 0.3.5+1
  pdfrx: 1.3.5
  synchronized: 3.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.30.0
  build_runner: 2.10.4
flutter:
  uses-material-design: true
