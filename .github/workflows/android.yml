name: Android APK
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release (requires signing secrets)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Dependencies and generated database
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Configure release signing
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daily-expenses.jks"
          python3 - <<'PY'
          import os
          def escape(s):
              return s.replace('\\','\\\\').replace('\n','\\n').replace('\r','\\r')
          with open('android/key.properties','w') as f:
              for k,v in {'storeFile':os.environ['RUNNER_TEMP']+'/daily-expenses.jks','storePassword':os.environ['STORE_PASSWORD'],'keyPassword':os.environ['KEY_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS']}.items():
                  f.write(k+'='+escape(v)+'\n')
          PY
      - name: Build APK
        env:
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          if [ "$RELEASE_BUILD" = "true" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-Expenses-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: Remove temporary signing credentials
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/daily-expenses.jks"
